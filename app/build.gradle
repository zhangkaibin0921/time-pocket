plugins { id 'com.android.application' }

android {
    namespace 'cn.timepocket.app'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.timepocket.app'
        minSdk 26
        targetSdk 35
        versionCode 41
        versionName '0.6.11'
        testInstrumentationRunner 'cn.timepocket.app.PocketInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
}
